configuration:
  instance:
    name: Instance
    description: The instance label of all metrics and log entries.
  metrics_url:
    name: Metrics URL
    description: Prometheus remote write endpoint, e.g. https://metrics.example.com/api/v1/write.
  metrics_api_key:
    name: Metrics API key
    description: Sent as bearer token with every remote write request.
  logs_url:
    name: Logs URL
    description: Loki push endpoint, e.g. https://logs.example.com/loki/api/v1/push.
  logs_api_key:
    name: Logs API key
    description: Sent as bearer token with every push request.
  log_level:
    name: Log level
    description: Alloy's own log level.
